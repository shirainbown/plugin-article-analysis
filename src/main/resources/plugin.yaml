apiVersion: plugin.halo.run/v1alpha1
kind: Plugin
metadata:
  name: article-analysis
spec:
  enabled: true
  requires: ">=2.21.0"
  settingName: article-analysis-settings
  configMapName: article-analysis-configMap
  author:
    name: shirainbown
    website: https://github.com/shirainbown
  logo: logo.svg
  displayName: 文章数据趋势分析
  description: 全站与单篇文章的数据趋势看板：浏览量、访客数、访问次数、跳出率、平均访问时长与每日点赞统计，支持筛选、排序与 CSV 导出。
  homepage: https://github.com/shirainbown/plugin-article-analysis
  repo: https://github.com/shirainbown/plugin-article-analysis
  issues: https://github.com/shirainbown/plugin-article-analysis/issues
  version: "@version@"
  license:
    - name: "MIT"
